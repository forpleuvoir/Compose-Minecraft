plugins {
    id 'java-library'
    id 'maven-publish'
    id "org.jetbrains.kotlin.jvm"
    id "org.jetbrains.kotlin.plugin.compose"
}

base {
    archivesName = "${mod_id}-${project.name}-${libs.versions.minecraft.get()}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
    withSourcesJar()
}

kotlin {
    jvmToolchain(Integer.parseInt(libs.versions.java.get()))
    compilerOptions {
        freeCompilerArgs.add('-jvm-default=enable')
        freeCompilerArgs.add('-Xcollection-literals')
        // Compose UI commonMain 源码(仓库内)使用 expect/actual;JVM 单平台内提供全部 actual,
        // 故启用 -Xexpect-actual-classes 保持现有 JVM 工程结构,不 KMP 化。
        freeCompilerArgs.add('-Xexpect-actual-classes')
        // 与官方 Compose 构建一致:模块级 opt-in,使仓库内源码无需逐文件 @OptIn
        freeCompilerArgs.add('-opt-in=androidx.compose.ui.InternalComposeUiApi')
        freeCompilerArgs.add('-opt-in=androidx.compose.ui.ExperimentalComposeUiApi')
        freeCompilerArgs.add('-opt-in=androidx.compose.ui.text.InternalTextApi')
        freeCompilerArgs.add('-opt-in=androidx.compose.ui.text.ExperimentalTextApi')
        freeCompilerArgs.add('-opt-in=androidx.compose.foundation.ExperimentalFoundationApi')
        freeCompilerArgs.add('-opt-in=androidx.compose.foundation.layout.ExperimentalLayoutApi')
        freeCompilerArgs.add('-opt-in=androidx.compose.animation.ExperimentalAnimationApi')
        freeCompilerArgs.add('-opt-in=androidx.compose.animation.core.ExperimentalAnimationSpecApi')
        freeCompilerArgs.add('-opt-in=androidx.compose.runtime.ExperimentalComposeApi')
    }
}

// Java 源码可引用 Kotlin 类(mixin 等):先编译 Kotlin,再把 Kotlin 类加入 javac 类路径。
// Kotlin 编译直接读取 Java 源码,不依赖 javac 产物,因此不存在循环依赖。
tasks.named('compileJava', JavaCompile) {
    dependsOn 'compileKotlin'
    classpath += files(project.layout.buildDirectory.dir('classes/kotlin/main'))
}

repositories {
    mavenCentral()
    mavenLocal()
    google()
    // Kotlin for Forge（neoforge 模块的 forgeKotlin 依赖）
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup "thedarkcolour" }
    }
    // Modrinth 模组 maven（IMBlocker：输入法兼容的可选依赖）
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup "maven.modrinth" }
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group, //Else we target the task's group.
            'minecraft_version'            : libs.versions.minecraft.get(),
            'minecraft_version_range'      : libs.versions.minecraftRange.get(),
            'fabric_loader_version'        : libs.versions.fabricLoader.get(),
            'fabric_kotlin_version'        : libs.versions.fabricKotlin.get(),
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'neoforge_loader_version_range': libs.versions.neoforgeRange.get(),
            'credits'                      : credits,
            'java_version'                 : libs.versions.java.get(),
            'forge_kotlin_version_range'   : libs.versions.forgeKotlinRange.get(),
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace("\n", "\\\\n") : value]
    }

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}

publishing {
    publications {
        "mod"(MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
    //https://reposilite.com/guide/gradle
    repositories {
        mavenLocal()
        maven {
            name = "releases"
            url = "https://maven.forpleuvoir.moe/releases"
            credentials(PasswordCredentials)
            authentication {
                basic(BasicAuthentication)
            }
        }
        maven {
            name = "snapshots"
            url = "https://maven.forpleuvoir.moe/snapshots"
            credentials(PasswordCredentials)
            authentication {
                basic(BasicAuthentication)
            }
        }
    }

}
